name: Build Bauricordi Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Bauricordi project
        run: |
          unzip -o Bauricordi-App.zip -d bauricordi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: bauricordi
        run: npm install

      - name: Setup Expo
        working-directory: bauricordi
        run: npm install --global eas-cli

      - name: Check project
        working-directory: bauricordi
        run: npx expo-doctor
