name: Build Bauricordi Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependencies
        run: npx expo install --check
      - name: Configure EAS with existing secret
        id: eas
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing or empty."
            exit 1
          fi
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest init --force --non-interactive
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir bundle-check
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify APK package and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -20
          mkdir -p artifacts
          cp "$APK" artifacts/Bauricordi-Android.apk
          sha256sum artifacts/Bauricordi-Android.apk > artifacts/SHA256.txt
          cp app.json eas.json artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: Bauricordi-Android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Report result
        if: always()
        env:
          EAS_OUTCOME: ${{ steps.eas.outcome }}
        run: |
          echo "EAS authentication/configuration: $EAS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "APK uses the Expo/React Native preview signing key; for installation testing only, not Play Store publication." >> "$GITHUB_STEP_SUMMARY"
