name: Build Bauricordi Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Bauricordi project
        run: unzip -o Bauricordi-App.zip -d bauricordi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: bauricordi
        run: npm install

      - name: Build web app
        working-directory: bauricordi
        run: npm run build

      - name: Build Android
        working-directory: bauricordi
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bauricordi-Android
          path: bauricordi/android/app/build/outputs/apk/debug/app-debug.apk
