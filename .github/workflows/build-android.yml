name: Build Bauricordi Free and Premium
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - '*.js'
      - '*.mjs'
      - '*.json'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Free-Premium
            preview: '0'
          - variant: Premium-Anteprima
            preview: '1'
    env:
      CI: '1'
      EXPO_PUBLIC_PREMIUM_DEMO: ${{ matrix.preview }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate data, backup and Premium rules
        run: npm test
      - name: Check Expo dependencies
        run: npx expo install --check
      - name: Verify EAS account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest whoami
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir bundle-check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify APK package and signature
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          "$BUILD_TOOLS/aapt" dump badging "$APK" > artifacts/apk-info.txt
          head -20 artifacts/apk-info.txt
          cp "$APK" "artifacts/Bauricordi-$VARIANT.apk"
          sha256sum "artifacts/Bauricordi-$VARIANT.apk" > artifacts/SHA256.txt
          npx expo config --type public --json > artifacts/app-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Bauricordi-${{ matrix.variant }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Report result
        run: |
          echo "Variant: ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview signing key: installation testing only. Purchases require configured RevenueCat and store products." >> "$GITHUB_STEP_SUMMARY"
